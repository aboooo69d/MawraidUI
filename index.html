<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%mawarid-symbol.svg" />
  <title>منصة موارد — تعز | إدارة وتوزيع الموارد الأساسية (الغاز، المياه، الوقود)</title>
  <meta name="description" content="المنظومة الرقمية المركزية لإدارة وتوزيع الموارد الحيوية في مدينة تعز بعدالة وشفافية." />
  <script>
    (() => {
      let preference
      try { preference = localStorage.getItem('mawarid-theme') } catch {}
      const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches
      document.documentElement.dataset.theme =
        preference === 'light' || preference === 'dark' ? preference : systemDark ? 'dark' : 'light'
    })()
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body class="min-h-screen antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
